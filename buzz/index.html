<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<title>Trivia Buzzer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root { --bg: #0b1b3a; --board: #122a5c; --tile: #1b3a7a; --tile-hi: #2a4d96; --fg: #f3f1ea; --muted: #9fb0d1; --gold: #f2c14e; --gold-2: #ffe59a; --accent: #e0442f; --good: #5ad184;
    --font-display: "Oswald", "Arial Narrow", Impact, sans-serif; --font-body: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; grid-template-rows: auto 1fr auto; gap: 16px; overflow: hidden; -webkit-user-select: none; user-select: none; }
  h1 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: var(--gold); font-size: 1.4rem; margin: 0; }
  .muted { color: var(--muted); font-size: .9rem; margin: 0; }
  .card { background: var(--board); border: 2px solid var(--gold); padding: 18px; display: grid; gap: 12px; align-content: start; }
  label { display: grid; gap: 4px; font-weight: 600; }
  input, select, button { font: inherit; }
  input, select { background: var(--bg); color: var(--fg); border: 1px solid var(--tile-hi); padding: 12px; font-size: 1.1rem; width: 100%; }
  input.code { font-family: var(--font-display); font-size: 2rem; letter-spacing: .4em; text-transform: uppercase; text-align: center; }
  .btn { background: var(--tile); color: var(--fg); border: 1px solid var(--tile-hi); padding: 14px; font-weight: 600; font-size: 1.1rem; cursor: pointer; }
  .btn.gold { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }
  .err { color: #ffb4a8; margin: 0; min-height: 1.2em; }

  /* game screen */
  #game { display: grid; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; }
  .status { text-align: center; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 1.1rem; color: var(--muted); min-height: 1.4em; }
  .status.win { color: var(--gold-2); }
  .status.lost { color: #ffb4a8; }
  .buzz { border: 0; border-radius: 50%; width: min(80vw, 60vh); height: min(80vw, 60vh); margin: auto; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 12vw, 4rem); letter-spacing: .1em; text-transform: uppercase; color: #1a1a1a; cursor: pointer; touch-action: manipulation;
    background: radial-gradient(circle at 35% 30%, #ff8a7a, var(--accent) 55%, #8f1f12); box-shadow: 0 18px 0 #6b150b, 0 30px 50px rgba(0,0,0,.6), inset 0 -10px 30px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s, filter .2s; }
  .buzz:active { transform: translateY(14px); box-shadow: 0 4px 0 #6b150b, 0 10px 20px rgba(0,0,0,.6); }
  .buzz[disabled] { filter: grayscale(.85) brightness(.55); cursor: default; }
  .buzz.won { background: radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 55%, #9a7418); box-shadow: 0 18px 0 #6b5010, 0 0 80px rgba(242,193,78,.8); animation: pulse .6s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.04); } }
  .buzz.armed { animation: breathe 1.4s ease-in-out infinite alternate; }
  @keyframes breathe { to { box-shadow: 0 18px 0 #6b150b, 0 30px 50px rgba(0,0,0,.6), 0 0 60px rgba(224,68,47,.9); } }
  .me { text-align: center; font-size: .95rem; color: var(--muted); }
  .me b { color: var(--fg); }
  .rename { display: grid; gap: 8px; justify-items: center; }
  .rename .btn { padding: 8px 14px; font-size: .95rem; }
  .renameBox { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; max-width: 420px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .foot button { background: none; border: 1px solid var(--tile-hi); color: var(--muted); padding: 8px 12px; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header><h1>Toronto Trivia Buzzer</h1><p class="muted" id="hdrSub">Join the game on the TV</p></header>

  <section id="join" class="card">
    <label>Room code<input class="code" id="room" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCD"></label>
    <label>Your name<input id="name" maxlength="20" autocomplete="nickname" placeholder="Andy"></label>
    <label>Team<select id="team"><option value="">Pick a team…</option></select></label>
    <label id="teamNameRow" hidden>Team name <span class="muted" style="font-weight:400">(shows on the TV)</span><input id="teamName" maxlength="24" autocomplete="off" placeholder="The Raccoons"></label>
    <button class="btn gold" id="joinBtn">Join</button>
    <p class="err" id="err"></p>
  </section>

  <section id="game" hidden>
    <div class="status" id="status">Waiting for a question…</div>
    <button class="buzz" id="buzz" disabled>Buzz</button>
    <div class="me" id="me"></div>
    <div class="rename" id="renameRow">
      <button class="btn" id="renameBtn">Rename team</button>
      <div class="renameBox" id="renameBox" hidden><input id="renameInput" maxlength="24" autocomplete="off" aria-label="Team name"><button class="btn gold" id="renameSave">Save</button></div>
    </div>
  </section>

  <footer class="foot">
    <span class="muted" id="conn">Connecting…</span>
    <button id="leave" hidden>Leave</button>
  </footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const DB_URL = 'https://to-trivia-default-rtdb.firebaseio.com';
const $ = id => document.getElementById(id);
let db, roomRef, pid, roomCode, myName, myTeam, state = null, teamsList = [];
try { pid = localStorage.getItem('buzz-pid'); } catch (e) {}
if (!pid) { pid = Math.random().toString(36).slice(2, 10); try { localStorage.setItem('buzz-pid', pid); } catch (e) {} }

function init() {
  if (!window.firebase) { $('conn').textContent = 'Could not load the buzzer service. Check your connection and reload.'; $('joinBtn').disabled = true; return; }
  firebase.initializeApp({ databaseURL: DB_URL });
  db = firebase.database();
  db.ref('.info/connected').on('value', s => { $('conn').textContent = s.val() ? 'Connected' : 'Reconnecting…'; });
  const params = new URLSearchParams(location.search);
  const r = (params.get('room') || '').toUpperCase();
  try { $('room').value = r || localStorage.getItem('buzz-room') || ''; $('name').value = localStorage.getItem('buzz-name') || ''; } catch (e) { $('room').value = r; }
  if ($('room').value.length === 4) loadTeams($('room').value);
  $('team').addEventListener('change', () => { const i = $('team').value; $('teamNameRow').hidden = i === ''; if (i !== '') $('teamName').value = $('team').options[$('team').selectedIndex].textContent; });
  $('room').addEventListener('input', () => { $('room').value = $('room').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if ($('room').value.length === 4) loadTeams($('room').value); });
}
function loadTeams(code) {
  db.ref('rooms/' + code + '/teams').once('value').then(s => {
    const t = s.val() || [], sel = $('team'); sel.innerHTML = '<option value="">Pick a team…</option>';
    t.forEach((name, i) => { const o = document.createElement('option'); o.value = i; o.textContent = name; sel.appendChild(o); });
    $('err').textContent = t.length ? '' : 'No game found with that code. Check the TV.';
    $('teamNameRow').hidden = true;
  }).catch(() => { $('err').textContent = 'Could not reach that room.'; });
}

$('joinBtn').addEventListener('click', async () => {
  roomCode = $('room').value.trim().toUpperCase(); myName = $('name').value.trim(); myTeam = $('team').value;
  if (roomCode.length !== 4) return $('err').textContent = 'Enter the 4-letter room code shown on the TV.';
  if (!myName) return $('err').textContent = 'Enter your name.';
  if (myTeam === '') return $('err').textContent = 'Pick a team.';
  const snap = await db.ref('rooms/' + roomCode + '/teams').once('value');
  if (!snap.exists()) return $('err').textContent = 'No game found with that code.';
  try { localStorage.setItem('buzz-room', roomCode); localStorage.setItem('buzz-name', myName); } catch (e) {}
  roomRef = db.ref('rooms/' + roomCode);
  const me = roomRef.child('players/' + pid);
  me.set({ name: myName, team: Number(myTeam), joined: firebase.database.ServerValue.TIMESTAMP });
  me.onDisconnect().remove();
  const tn = $('teamName').value.trim();
  if (tn && tn !== $('team').options[$('team').selectedIndex].textContent) roomRef.child('teams/' + myTeam).set(tn);
  $('join').hidden = true; $('game').hidden = false; $('leave').hidden = false;
  $('hdrSub').textContent = 'Room ' + roomCode;
  roomRef.child('teams').on('value', s => { teamsList = s.val() || []; $('me').innerHTML = ''; const b = document.createElement('b'); b.textContent = myName; $('me').append(b, ' · ' + (teamsList[myTeam] || 'Team')); });
  roomRef.child('state').on('value', s => { state = s.val(); render(); });
  roomRef.child('winner').on('value', s => { winner = s.val(); render(); });
  roomRef.child('buzzes/' + pid).on('value', s => { buzzed = s.exists(); render(); });
});
let winner = null, buzzed = false, lastState = null;
function render() {
  const b = $('buzz'), st = $('status');
  b.classList.remove('won', 'armed'); st.className = 'status';
  if (!state || state === 'idle') { b.disabled = true; st.textContent = 'Waiting for a question…'; }
  else if (state === 'armed') { b.disabled = buzzed; b.classList.toggle('armed', !buzzed); st.textContent = buzzed ? 'Buzzed! Waiting for the TV…' : 'Buzz in!'; }
  else if (state === 'locked') {
    b.disabled = true;
    if (winner && winner.pid === pid) { b.classList.add('won'); st.classList.add('win'); st.textContent = 'You buzzed first!'; if (lastState !== 'locked') vibrate([80, 40, 80, 40, 200]); }
    else { st.classList.add('lost'); st.textContent = winner ? (winner.name + ' buzzed first') : 'Locked'; if (lastState !== 'locked') vibrate(60); }
  }
  lastState = state;
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
$('buzz').addEventListener('click', () => {
  if (state !== 'armed' || buzzed) return;
  buzzed = true; render(); vibrate(30);
  roomRef.child('buzzes/' + pid).set({ name: myName, team: Number(myTeam), at: firebase.database.ServerValue.TIMESTAMP });
});
$('renameBtn').addEventListener('click', () => { $('renameBox').hidden = false; $('renameBtn').hidden = true; $('renameInput').value = teamsList[myTeam] || ''; $('renameInput').focus(); $('renameInput').select(); });
function saveRename() { const v = $('renameInput').value.trim(); if (v) roomRef.child('teams/' + myTeam).set(v); $('renameBox').hidden = true; $('renameBtn').hidden = false; vibrate(20); }
$('renameSave').addEventListener('click', saveRename);
$('renameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveRename(); } if (e.key === 'Escape') { $('renameBox').hidden = true; $('renameBtn').hidden = false; } });
$('leave').addEventListener('click', () => { if (roomRef) roomRef.child('players/' + pid).remove(); location.href = location.pathname; });
init();
</script>
</body>
</html>
